name: Fetch Norway Ecology Jobs

on:
  schedule:
    # Run daily at 06:00 UTC (08:00 CET / 07:00 CET winter)
    - cron: '0 6 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  fetch:
    name: Scrape job portals and update jobs.json
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated jobs.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scripts/fetch_jobs.py

      - name: Commit and push updated jobs.json
        uses: EndBug/add-and-commit@v9
        with:
          add: 'docs/data/jobs.json'
          message: 'data: update job listings [skip ci]'
          default_author: github_actions
          # Only commit if the file actually changed
          push: true
