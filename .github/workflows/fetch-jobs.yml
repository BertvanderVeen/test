name: Fetch Norway & Sweden Ecology Jobs

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch:
    name: Scrape job portals and update jobs.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Save previous job IDs
        run: python scripts/save_prev_ids.py

      - name: Run scraper
        run: python scripts/fetch_jobs.py

      - name: Commit and push updated jobs.json
        uses: EndBug/add-and-commit@v9.1.4
        with:
          add: 'docs/data/jobs.json'
          message: 'data: update job listings [skip ci]'
          default_author: github_actions
          push: true

      - name: Open issue for new positions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python scripts/notify_new_jobs.py
